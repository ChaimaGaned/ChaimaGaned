<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0718" />
      <stop offset="50%" stop-color="#140d2e" />
      <stop offset="100%" stop-color="#1e1045" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <radialGradient id="glowViolet" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07" />
    </pattern>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 50px;
        fill: url(#titleGrad);
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        font-size: 21px;
        fill: #cbd5e1;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .badge-bg {
        fill: #1e1b4b;
        fill-opacity: 0.7;
        stroke: #6366f1;
        stroke-opacity: 0.4;
        stroke-width: 1;
        rx: 16;
      }
    </style>
  </defs>

  <!-- Base Card with rounded corners -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)" />

  <!-- Background Dots Pattern -->
  <rect width="1200" height="320" rx="20" fill="url(#dotGrid)" />

  <!-- Ambient Glow Orbs -->
  <rect width="1200" height="320" rx="20" fill="url(#glowViolet)" />
  <rect width="1200" height="320" rx="20" fill="url(#glowCyan)" />

  <!-- Top Accent Border -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#lineGrad)" />

  <!-- Decorative Modern Curves -->
  <path d="M-50,280 C250,330 450,220 800,290 C1000,330 1150,260 1250,300" fill="none" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="2" />
  <path d="M-50,300 C300,240 600,320 900,250 C1080,210 1180,270 1250,280" fill="none" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Main Content Centered -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Title -->
    <text class="title" y="0">Chaima Ganed</text>

    <!-- Subtitle -->
    <text class="subtitle" y="44">Software Engineer  •  Full-Stack &amp; AI Specialist</text>

    <!-- Decorative Divider Line -->
    <line x1="-180" y1="72" x2="180" y2="72" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Tech Badges Bar (Centered below) -->
  <g transform="translate(600, 240)">
    <!-- Badge 1: Microservices -->
    <g transform="translate(-360, 0)">
      <rect class="badge-bg" x="-75" y="-16" width="150" height="32" />
      <text class="badge-text" text-anchor="middle" y="5">⚡ Microservices</text>
    </g>
    <!-- Badge 2: Java / Spring -->
    <g transform="translate(-180, 0)">
      <rect class="badge-bg" x="-75" y="-16" width="150" height="32" />
      <text class="badge-text" text-anchor="middle" y="5">☕ Java / Spring</text>
    </g>
    <!-- Badge 3: Angular / TypeScript -->
    <g transform="translate(0, 0)">
      <rect class="badge-bg" x="-85" y="-16" width="170" height="32" />
      <text class="badge-text" text-anchor="middle" y="5">🅰️ Angular / TypeScript</text>
    </g>
    <!-- Badge 4: Python & RAG -->
    <g transform="translate(180, 0)">
      <rect class="badge-bg" x="-75" y="-16" width="150" height="32" />
      <text class="badge-text" text-anchor="middle" y="5">🧠 GenAI &amp; RAG</text>
    </g>
    <!-- Badge 5: Docker & Cloud -->
    <g transform="translate(360, 0)">
      <rect class="badge-bg" x="-75" y="-16" width="150" height="32" />
      <text class="badge-text" text-anchor="middle" y="5">🐳 Docker / DevOps</text>
    </g>
  </g>
</svg>
